_target_: morphseg.datamodules.MorphologyDataModule

data_paths:
  train: data/soft-clean-oov/ru/tikhonov/train.jsonl
  val: data/soft-clean-oov/ru/tikhonov/val.jsonl

cache_dir: .cache/tokenized

prompt_template: |
  ### Instruction:
  Вы — эксперт-лингвист. Ваша задача — выполнить морфемный разбор слова по словарю Тихонова.

  ### Output Format:
  - Ответ должен быть в формате: морфема1:ТЕГ1/морфема2:ТЕГ2
  - Пример: пере:PREF/ход:ROOT/н:SUFF/ый:END
  - Используйте теги: :ROOT, :PREF, :SUFF, :END, :LINK, :POST, :HYPN.

  ### Constraints:
  - Строго сохраняйте буквенный состав слова.
  - Мягкий знак (ь) после корня всегда относится к корню (:ROOT).
  - Не добавляйте пояснений, только строку разбора.

  ### Word: {word}
  ### Response:

tokenizer_prompt_cfg:
  truncation: true
  max_length: 800
  padding: false

tokenizer_full_text_cfg:
  truncation: true
  max_length: 900
  padding: false

train_dataloader_cfg:
  batch_size: 8
  shuffle: true
  num_workers: 4
  pin_memory: true
  persistent_workers: true

val_dataloader_cfg:
  batch_size: 8
  shuffle: false
  num_workers: 4
  pin_memory: true
  persistent_workers: true

collator_cfg:
  _target_: morphseg.datamodules.DataCollatorContainingPrompt
  padding: "longest"
  label_pad_token_id: -100
  return_tensors: "pt"

logic_version: v3_version