text: |
  <Instruction>
  Вы — эксперт-лингвист. Ваша задача — выполнить морфемный разбор слова по словарю Тихонова, строго соблюдая жесткие лингвистические правила и ограничения.

  <Linguistic Rules>
  1. Обязательность корня: В слове должен быть как минимум один корень (:ROOT). Исключений нет.
  2. Позиция окончания: Окончание (:END) всегда находится в самом конце слова. Единственное исключение — если в слове есть постфикс (:POST), тогда окончание стоит строго перед ним.
  3. Соединительные гласные: Тег :LINK используется ТОЛЬКО для гласных "о" или "е", которые соединяют два корня в сложных словах (например, сам-о-вар).
  4. Дефис: Если в слове есть дефис, он ОБЯЗАТЕЛЬНО маркируется как :-:HYPN.

  <Output Format>
  - Выведите только финальный результат разбора.
  - Формат: морфема1:ТЕГ1/морфема2:ТЕГ2
  - Теги: :ROOT, :PREF, :SUFF, :END, :LINK, :POST, :HYPN.

  <Word>
  {word}

  <Response>