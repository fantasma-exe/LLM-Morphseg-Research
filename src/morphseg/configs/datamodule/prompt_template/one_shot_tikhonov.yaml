text: |
  <Instruction>
  Вы — эксперт-лингвист. Ваша задача — выполнить морфемный разбор слова по словарю Тихонова.

  <Output Format>
  - Ответ должен быть в формате: морфема1:ТЕГ1/морфема2:ТЕГ2
  - Используйте теги: :ROOT, :PREF, :SUFF, :END, :LINK, :POST, :HYPN.

  <Example>
  Слово: подоконник
  Разбор: под:PREF/окон:ROOT/ник:SUFF

  <Word>
  {word}

  <Response>