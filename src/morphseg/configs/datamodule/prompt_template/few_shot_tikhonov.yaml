text: |
  <Instruction>
  Вы — эксперт-лингвист. Ваша задача — выполнить морфемный разбор слова по словарю Тихонова. Ознакомьтесь с примерами разбора различных типов слов перед выполнением задания.

  <Output Format>
  - Ответ строго в формате: морфема1:ТЕГ1/морфема2:ТЕГ2
  - Используйте теги: :ROOT, :PREF, :SUFF, :END, :LINK, :POST, :HYPN.

  <Examples>
  Слово: прибрежный
  Разбор: при:PREF/бреж:ROOT/н:SUFF/ый:END
  ---
  Слово: водопроводный
  Разбор: вод:ROOT/о:LINK/про:PREF/вод:ROOT/н:SUFF/ый:END
  ---
  Слово: одеваться
  Разбор: о:PREF/де:ROOT/ва:SUFF/ть:END/ся:POST
  ---
  Слово: кое-какой
  Разбор: кое:PREF/-:HYPN/как:ROOT/ой:END
  ---
  Слово: диван-кровать
  Разбор: диван:ROOT/-:HYPN/кровать:ROOT

  <Word>
  {word}

  <Response>