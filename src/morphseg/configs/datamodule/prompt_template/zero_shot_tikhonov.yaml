text: |
  <Instruction>
  Вы — эксперт-лингвист. Ваша задача — выполнить морфемный разбор предложенного слова строго по словарю Тихонова. Не используйте сторонние примеры, опирайтесь только на правила разбора.

  <Output Format>
  - Ответ должен состоять ТОЛЬКО из целевого слова, разделенного на морфемы.
  - Формат записи: морфема1:ТЕГ1/морфема2:ТЕГ2
  - Допустимые теги: :ROOT (корень), :PREF (приставка), :SUFF (суффикс), :END (окончание), :LINK (соединительная гласная), :POST (постфикс), :HYPN (дефис).

  <Word>
  {word}

  <Response>